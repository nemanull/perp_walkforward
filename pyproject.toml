[project]
name = "walkforward"
version = "0.1.0"
description = "Monthly walk-forward evaluation of short-horizon return models on five Binance perpetuals"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
