[project]
name = "walkforward"
version = "0.1.0"
description = "Monthly walk-forward evaluation of short-horizon return models on five Binance perpetuals"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
notebook = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
